<!DOCTYPE html>

<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base { html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } }</style><link rel="stylesheet" href="../css/01-portada.css"/></head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen"><main class="flex-1 w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full relative overflow-hidden select-none">
<!-- Contenedor de Fotografía Editorial a Sangre -->
<div class="relative w-full aspect-[9/16] min-h-[640px] max-h-[840px] flex flex-col justify-between" style="aspect-ratio:auto;height:100vh;height:100dvh;min-height:640px;max-height:none">
<!-- Imagen de fondo de despensa otoñal -->
<img alt="Mesa rústica de madera con zapallo, calabazas, batatas, manzanas, hierbas frescas y libros de diseño bajo luz natural cálida" class="absolute inset-0 w-full h-full object-cover object-center pointer-events-none" src="../img/mesa.webp"/>
<!-- Degradados sutiles para proteger la legibilidad editorial superior e inferior -->
<div class="absolute inset-x-0 top-0 h-32 bg-gradient-to-b from-on-surface/40 via-on-surface/10 to-transparent pointer-events-none"></div>
<div class="absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-on-surface/60 via-on-surface/20 to-transparent pointer-events-none"></div>
<!-- Cabecera Superior -->
<header class="relative z-10 flex items-start justify-between px-6 pt-6">
<div class="flex flex-col">
<span class="font-headline-md text-headline-md tracking-wider text-surface-container-lowest drop-shadow-sm leading-none">
          RAÍZ
        </span>
<div class="flex items-center gap-1.5 mt-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-secondary-container"></span>
<span class="font-label-sm text-label-sm uppercase tracking-widest text-surface-container-lowest/90 font-medium">
            Revista Digital
          </span>
</div>
</div>
<!-- Indicador de Paginación Editorial -->
<div class="flex items-center gap-2 px-3 py-1 rounded bg-inverse-surface/30 backdrop-blur-md">
<span class="font-label-md text-label-md text-surface-container-lowest font-medium tracking-widest">
          01 <span class="text-surface-container-lowest/50">/</span> 08
        </span>
</div>
</header>
<!-- Panel Inferior (Bottom Editorial Card) -->
<div class="relative z-10 px-4 pb-6 w-full">
<section class="w-full bg-surface-container-low/95 backdrop-blur-md rounded-lg p-6 shadow-sm flex flex-col gap-3">
<!-- Kicker / Tag estacional -->
<div class="flex items-center gap-2">
<span class="inline-flex items-center px-2 py-0.5 rounded bg-secondary-container/15 font-label-sm text-label-sm uppercase tracking-wider text-secondary font-semibold">
            Edición 01 · Otoño
          </span>
</div>
<!-- Título principal -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight leading-tight">
          La despensa de estación
        </h1>
<!-- Copete / Bajada descriptiva -->
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
          Recetas simples, ingredientes de temporada y hábitos para cocinar con lo que hay.
        </p>
<!-- Indicador de avance / Micro-interacción de lectura -->
<div class="pt-2 flex items-center justify-between">
<button aria-label="Deslizar para comenzar la lectura" class="group inline-flex items-center gap-2 text-primary font-label-md text-label-md uppercase tracking-wider font-semibold active:opacity-70 transition-opacity" id="readMagazineBtn" type="button">
<span>Deslizar para leer</span>
<span class="material-symbols-outlined text-secondary transition-transform duration-300 group-hover:translate-y-0.5" style="font-size: 18px;">
              south
            </span>
</button>
<!-- Elemento decorativo de pliego editorial impreso -->
<div class="flex items-center gap-1.5 opacity-60">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
<span class="w-8 h-0.5 rounded-full bg-outline-variant"></span>
</div>
</div>
</section>
</div>
</div>
</div>
<script>
  (function() {
    const readBtn = document.getElementById('readMagazineBtn');
    if (readBtn) {
      readBtn.addEventListener('click', function() {
        const nextTarget = window.innerHeight * 0.7;
        window.scrollBy({ top: nextTarget, behavior: 'smooth' });
      });
    }
  })();
</script></main><script>
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();var h=a.getAttribute('href').slice(1);if(window.parent!==window&&h){window.parent.postMessage({raizGoto:h},'*');}});
</script></body></html>
